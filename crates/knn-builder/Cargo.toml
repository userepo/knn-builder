[package]
name = "knn-builder"
description = "Drop-in remote vector index build service for OpenSearch k-NN"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Builds on the GPU through knn-gpu's cuVS shim; without it, only the
# fake builder exists. Needs what knn-gpu's `gpu` feature needs.
gpu = ["knn-gpu/gpu"]

[dependencies]
axum.workspace = true
base64.workspace = true
knn-gpu.workspace = true
knn-store.workspace = true
knn-write.workspace = true
# The build request: read as a JSON value, then checked field by field as
# the service's model checks it; in the body's order, which is the order
# the service reports unknown fields in, and with every decimal rounded
# correctly, as Python rounds it.
serde_json = { workspace = true, features = ["preserve_order", "float_roundtrip"] }
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync", "macros", "net", "signal", "time"] }
# The API's path decoding wraps the router.
tower.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
# The LocalStack tests set up and inspect their bucket with the SDK.
aws-sdk-s3.workspace = true

[[example]]
name = "e2e"
required-features = ["gpu"]

[lints]
workspace = true
