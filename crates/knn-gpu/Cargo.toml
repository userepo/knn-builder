[package]
name = "knn-gpu"
description = "CAGRA graph builds on the GPU through cuVS for a remote vector index build"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# The cuVS build. Off by default, so the crate builds anywhere; on, it
# needs Linux, a C++20 compiler and the conda environment in
# environment.yml (libcuvs, the CUDA runtime, CMake).
gpu = ["dep:cmake"]

[dependencies]
thiserror.workspace = true

[build-dependencies]
cmake = { workspace = true, optional = true }

[dev-dependencies]
# The parity example writes each graph out as the service would.
knn-write.workspace = true
serde_json.workspace = true

[[test]]
name = "cagra_build"
required-features = ["gpu"]

[[test]]
name = "leak"
required-features = ["gpu"]

[[example]]
name = "build_inputs"
required-features = ["gpu"]

[lints]
workspace = true
