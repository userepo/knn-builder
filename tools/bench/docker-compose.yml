# One remote index build service on the GPU for the benchmark: knn-builder's
# image, or the upstream service at the pinned commit (ea7db9f, as the
# api-snapshot image of that digest), with S3 and an uploader for the
# inputs. S3 is LocalStack (the localstack profile) or a bucket on real S3,
# which the s3 service serves to the host as LocalStack would (the s3
# profile). tools/bench/run.py drives it from the host, where nvidia-smi
# samples the GPU; it starts the services with the settings each phase
# needs and takes them down. Every port is published on the host's
# loopback only: on a cloud host the s3 service would otherwise let anyone
# read and delete the bucket's objects.
name: knn-builder-bench

x-aws: &aws
  # Set by run.py for LocalStack (its endpoint and test credentials), or
  # taken from the host's environment for real S3. One unset there is
  # unset here, so the AWS SDKs fall back to their default chain, such as
  # an instance role.
  S3_ENDPOINT_URL:
  AWS_ACCESS_KEY_ID:
  AWS_SECRET_ACCESS_KEY:
  AWS_SESSION_TOKEN:
  AWS_DEFAULT_REGION:

services:
  localstack:
    profiles: ["localstack"]
    # 4.14, the version upstream's e2e test uses.
    image: localstack/localstack@sha256:3ebc37595918b8accb852f8048fef2aff047d465167edd655528065b07bc364a
    environment:
      SERVICES: s3
    ports:
      - "127.0.0.1:${S3_PORT:-4568}:4566"

  s3:
    profiles: ["s3"]
    image: opensearchstaging/remote-vector-index-builder@sha256:e8fecaefc43cfaf4d04f35072f10baedf0ece3a539efac5340e5ab0c095da8bc
    entrypoint: ["python", "/work/tools/bench/s3_proxy.py"]
    environment:
      BENCH_BUCKET: ${BENCH_BUCKET:-bench}
      <<: *aws
    ports:
      - "127.0.0.1:${S3_PORT:-4568}:4566"
    volumes:
      - ../..:/work:ro

  service:
    image: ${SERVICE_IMAGE:?set SERVICE_IMAGE}
    environment:
      # The GPU's memory, not the default 24: what the upstream service
      # bounds its estimate by.
      GPU_MEMORY_LIMIT: ${GPU_MEMORY_LIMIT:-8}
      CLIENT_TIMEOUT_SECONDS: ${CLIENT_TIMEOUT_SECONDS:-3600}
      CLIENT_POLL_INTERVAL_SECONDS: ${CLIENT_POLL_INTERVAL_SECONDS:-5}
      # The upstream service's builds at once; knn-builder reads and
      # ignores it. Under WSL2 two builds at once crash the process.
      MAX_WORKERS: ${MAX_WORKERS:-1}
      # Each job's stage times, in the logs of both services.
      LOG_LEVEL: DEBUG
      # knn-builder's recall check, off unless run.py turns it on; the
      # upstream service reads neither.
      RECALL_CHECK_QUERIES: ${RECALL_CHECK_QUERIES:-0}
      RECALL_CHECK_K: ${RECALL_CHECK_K:-10}
      <<: *aws
    ports:
      - "127.0.0.1:${SERVICE_PORT:-1026}:1025"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    depends_on:
      localstack:
        condition: service_started
        required: false

  uploader:
    image: opensearchstaging/remote-vector-index-builder@sha256:e8fecaefc43cfaf4d04f35072f10baedf0ece3a539efac5340e5ab0c095da8bc
    entrypoint: ["python", "/work/tools/bench/upload.py"]
    environment:
      INPUT_DIRS: ${INPUT_DIRS:-}
      BENCH_BUCKET: ${BENCH_BUCKET:-bench}
      # 1 for LocalStack, which starts without the bucket; real S3's must
      # exist already.
      BENCH_CREATE_BUCKET: ${BENCH_CREATE_BUCKET:-}
      <<: *aws
    volumes:
      - ../..:/work:ro
    depends_on:
      localstack:
        condition: service_started
        required: false
