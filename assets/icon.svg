    <rect x="160" y="408" width="32" height="64" rx="10"/>
    <rect x="240" y="408" width="32" height="64" rx="10"/>
    <rect x="320" y="408" width="32" height="64" rx="10"/>
    <rect x="40" y="160" width="64" height="32" rx="10"/>
    <rect x="40" y="240" width="64" height="32" rx="10"/>
    <rect x="40" y="320" width="64" height="32" rx="10"/>
    <rect x="408" y="160" width="64" height="32" rx="10"/>
    <rect x="408" y="240" width="64" height="32" rx="10"/>
