[workspace]
resolver = "3"
members = [
    "crates/knn-write",
    "crates/knn-gpu",
    "crates/knn-store",
    "crates/knn-builder",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
authors = ["Ivan Petrouchtchak"]
license = "Apache-2.0"
repository = "https://github.com/userepo/knn-builder"
publish = false

[workspace.dependencies]
# knn-gpu's parity example writes each graph with it.
knn-write = { path = "crates/knn-write" }

# knn-write and knn-gpu: their error types.
thiserror = "2.0.21"
# knn-write's tests: fp32 to fp16, rounding to nearest even as numpy does.
half = "2.7.1"

# knn-write's tests: knn-inspect's reader and checks, at a pinned commit,
# read back what the writer writes; fixtures and generated cases.
knn-format = { git = "https://github.com/userepo/knn-inspect", rev = "155da57dbb411bfbd5042094934ca35b3191325b" }
knn-check = { git = "https://github.com/userepo/knn-inspect", rev = "155da57dbb411bfbd5042094934ca35b3191325b" }
proptest = "1.12.0"
serde_json = "1.0.154"

# knn-gpu's build script: builds its C++ shim over cuVS with CMake.
cmake = "0.1.58"

[workspace.lints.rust]
ambiguous_negative_literals = "warn"
missing_debug_implementations = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"

[workspace.lints.clippy]
cargo = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }

# Panic hygiene: a job must fail with a status, never take the service
# down, so a panic site in production code must carry a written
# justification. `unwrap` is banned while `expect` (with its reason
# string) stays allowed; tests keep `unwrap` and indexing via clippy.toml.
unwrap_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
panic_in_result_fn = "deny"
string_slice = "deny"
indexing_slicing = "deny"
exit = "deny"

# `unsafe` is confined to the FFI with knn-gpu's C++ shim over cuVS and
# with the CUDA runtime; every block carries a SAFETY comment.
undocumented_unsafe_blocks = "deny"
