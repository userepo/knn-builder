[workspace]
resolver = "3"
members = [
    "crates/knn-write",
    "crates/knn-gpu",
    "crates/knn-store",
    "crates/knn-builder",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
authors = ["Ivan Petrouchtchak"]
license = "Apache-2.0"
repository = "https://github.com/userepo/knn-builder"
publish = false

[workspace.dependencies]
# knn-gpu: the CAGRA build. Both crates are pinned exactly: their version
# must match libcuvs 26.08.01, the one the upstream service's base image
# installs (environment.yml). cuvs asks for cuvs-sys with a caret, which
# would resolve to a newer cuvs-sys, so cuvs-sys is pinned here as well.
cuvs = "=26.8.1"
cuvs-sys = "=26.8.1"

[workspace.lints.rust]
ambiguous_negative_literals = "warn"
missing_debug_implementations = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"

[workspace.lints.clippy]
cargo = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }

# Panic hygiene: a job must fail with a status, never take the service
# down, so a panic site in production code must carry a written
# justification. `unwrap` is banned while `expect` (with its reason
# string) stays allowed; tests keep `unwrap` and indexing via clippy.toml.
unwrap_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
panic_in_result_fn = "deny"
string_slice = "deny"
indexing_slicing = "deny"
exit = "deny"

# `unsafe` is confined to the FFI with cuVS and the CUDA runtime; every
# block carries a SAFETY comment.
undocumented_unsafe_blocks = "deny"
