[workspace]
resolver = "3"
members = [
    "crates/knn-write",
    "crates/knn-gpu",
    "crates/knn-store",
    "crates/knn-builder",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
authors = ["Ivan Petrouchtchak"]
license = "Apache-2.0"
repository = "https://github.com/userepo/knn-builder"
publish = false

[workspace.dependencies]
# knn-gpu's parity example writes each graph with it; the service writes
# every index with it.
knn-write = { path = "crates/knn-write" }
# The service's pipeline: the build, and the transfers around it.
knn-gpu = { path = "crates/knn-gpu" }
knn-store = { path = "crates/knn-store" }

# knn-write and knn-gpu: their error types.
thiserror = "2.0.21"
# knn-write's tests: fp32 to fp16, rounding to nearest even as numpy does.
half = "2.7.1"

# knn-write's tests: knn-inspect's reader and checks, at a pinned commit,
# read back what the writer writes; fixtures and generated cases.
knn-format = { git = "https://github.com/userepo/knn-inspect", rev = "155da57dbb411bfbd5042094934ca35b3191325b" }
knn-check = { git = "https://github.com/userepo/knn-inspect", rev = "155da57dbb411bfbd5042094934ca35b3191325b" }
proptest = "1.12.0"
serde_json = "1.0.154"

# knn-gpu's build script: builds its C++ shim over cuVS with CMake.
cmake = "0.1.58"

# knn-store: S3 through the AWS SDK. The SDK's default HTTPS client runs
# rustls on aws-lc, whose OpenSSL license deny.toml does not allow, so
# the defaults are off and rustls runs on ring instead. The credential
# chain keeps `credential_process` and SSO profiles, as boto3's does.
aws-config = { version = "1.13.0", default-features = false, features = ["rt-tokio", "credentials-process", "sso"] }
aws-sdk-s3 = { version = "1.155.0", default-features = false, features = ["rt-tokio"] }
aws-smithy-http-client = { version = "1.5.2", features = ["rustls-ring"] }
futures-util = "0.3.34"
tokio = "1.54.1"

[workspace.lints.rust]
ambiguous_negative_literals = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"
# `unsafe` lives in knn-gpu's FFI module and the GPU test that reads the
# CUDA runtime's memory counters; each opts out with an `expect`.
unsafe_code = "deny"

[workspace.lints.clippy]
cargo = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }

# Panic hygiene: a job must fail with a status, never take the service
# down, so a panic site in production code must carry a written
# justification. `unwrap` is banned while `expect` (with its reason
# string) stays allowed; tests keep `unwrap` and indexing via clippy.toml.
unwrap_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
panic_in_result_fn = "deny"
string_slice = "deny"
indexing_slicing = "deny"
exit = "deny"

# Every `unsafe` block, in the places `unsafe_code` allows, carries a
# SAFETY comment.
undocumented_unsafe_blocks = "deny"
