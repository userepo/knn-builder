# cargo-deny policy. Run `cargo deny check`.
#
# knn-builder is Apache-2.0 and meant as a drop-in for an OpenSearch
# project service, so dependencies stay permissive: any license not
# listed here fails the check for deliberate review.

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
]
# Our own crates are unpublished and carry the workspace license.
private = { ignore = true }

[bans]
multiple-versions = "warn"

[advisories]
yanked = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
